name: Error (bug)
description: Algo no funciona como debería
title: "[Error] "
labels: ["tipo: bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entrar como administrador
        2. Escanear el mismo QR dos veces
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Local
        - Vista previa de un PR
        - Pruebas (develop)
        - Producción (main)
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Capturas o registros
      description: No incluyas contraseñas, llaves ni datos personales reales.
